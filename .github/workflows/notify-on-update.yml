name: Notify on real update

# 當 index.html 有「實際內容更新」（新增 DATA_* 版本條目或 INSP_* 靈感卡）時，
# 透過 Telegram 與 Slack 發通知。只更新 <b id="lastRefreshed"> 同步時間戳的 commit 不觸發。
# 偵測完全靠 git diff，與排程 agent / push 腳本解耦。
#
# 需要的 secrets（未設定的管道會自動跳過，不會讓 workflow 失敗）：
#   TELEGRAM_BOT_TOKEN  BotFather 給的 token
#   TELEGRAM_CHAT_ID    收訊的 chat / channel id
#   SLACK_WEBHOOK_URL   Slack Incoming Webhook URL

on:
  push:
    branches: [main]
    paths:
      - index.html
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect real content change
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          # ── 手動觸發：直接視為要發一則測試通知 ──
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            {
              echo "should_send=true"
              echo "is_test=true"
              echo "new_entries=0"
              echo "new_cards=0"
            } >> "$GITHUB_OUTPUT"
            {
              echo "summary<<EOF"
              echo "（手動觸發的測試通知）"
              echo "EOF"
              echo "versions<<EOF"
              echo "EOF"
              echo "cards<<EOF"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ── 決定 diff 範圍 ──
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"
          ZERO="0000000000000000000000000000000000000000"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "$ZERO" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "before SHA 不可用，退回 HEAD~1..HEAD"
            BEFORE="$(git rev-parse HEAD~1)"
            AFTER="$(git rev-parse HEAD)"
          fi
          echo "diff 範圍：$BEFORE..$AFTER"

          # ── 取新增行（排除 +++ 檔頭）──
          ADDED="$(git diff "$BEFORE" "$AFTER" -- index.html | grep -E '^\+' | grep -vE '^\+\+\+' || true)"

          # 新版本條目：DATA_* 物件的 v: "..." 欄位（排除時間戳那行）
          NEW_ENTRIES="$(printf '%s\n' "$ADDED" | grep -E '[^A-Za-z]v:[[:space:]]*"' | grep -v 'lastRefreshed' || true)"
          # 新靈感卡：含 auto: true 的行
          NEW_CARDS="$(printf '%s\n' "$ADDED" | grep -E 'auto:[[:space:]]*true' || true)"

          n_entries=$(printf '%s\n' "$NEW_ENTRIES" | grep -cE '.' || true)
          n_cards=$(printf '%s\n' "$NEW_CARDS" | grep -cE '.' || true)
          echo "new_entries=$n_entries  new_cards=$n_cards"

          should_send=false
          if [ "$n_entries" -gt 0 ] || [ "$n_cards" -gt 0 ]; then
            should_send=true
          fi

          # 抽人類可讀內容：版本號、靈感卡標題、commit summary
          versions="$(printf '%s\n' "$NEW_ENTRIES" | grep -oE 'v:[[:space:]]*"[^"]+"' | sed -E 's/v:[[:space:]]*"([^"]+)"/\1/' | sort -u || true)"
          cards="$(printf '%s\n' "$ADDED" | grep -oE 'feat:[[:space:]]*"[^"]+"' | sed -E 's/feat:[[:space:]]*"([^"]+)"/\1/' | sort -u || true)"
          summary="$(git log -1 --format=%b "$AFTER" || true)"

          {
            echo "should_send=$should_send"
            echo "is_test=false"
            echo "new_entries=$n_entries"
            echo "new_cards=$n_cards"
          } >> "$GITHUB_OUTPUT"
          {
            echo "versions<<EOF"; printf '%s\n' "$versions"; echo "EOF"
            echo "cards<<EOF";    printf '%s\n' "$cards";    echo "EOF"
            echo "summary<<EOF";  printf '%s\n' "$summary";  echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build messages
        if: steps.detect.outputs.should_send == 'true'
        id: msg
        shell: bash
        # 透過 env 傳入動態值，避免把 ${{ }} 直接插進 shell（防 injection / 引號破壞）
        env:
          IS_TEST: ${{ steps.detect.outputs.is_test }}
          NEW_ENTRIES: ${{ steps.detect.outputs.new_entries }}
          NEW_CARDS: ${{ steps.detect.outputs.new_cards }}
          VERSIONS: ${{ steps.detect.outputs.versions }}
          CARDS: ${{ steps.detect.outputs.cards }}
          SUMMARY: ${{ steps.detect.outputs.summary }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          set -euo pipefail
          PAGE="https://kuoann.github.io/ai-changelog/"

          # 跳脫 & < >：Telegram HTML 與 Slack mrkdwn 都吃 &amp; &lt; &gt;
          esc() { sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }
          bullets() { while IFS= read -r line; do [ -n "$line" ] && printf '• %s\n' "$(printf '%s' "$line" | esc)"; done; }

          V_LIST="$(printf '%s\n' "$VERSIONS" | bullets || true)"
          C_LIST="$(printf '%s\n' "$CARDS" | bullets || true)"
          [ -z "$V_LIST" ] && V_LIST="•（無新版本條目）"
          [ -z "$C_LIST" ] && C_LIST="•（本次無新靈感卡）"
          SUMMARY_ESC="$(printf '%s' "$SUMMARY" | esc)"

          if [ "$IS_TEST" = "true" ]; then
            TITLE="🧪 AI Changelog 通知測試"
            INTRO="這是一則手動觸發的測試通知，用來確認 Telegram / Slack 設定正確。"
          else
            TITLE="🆕 AI Changelog 有新更新（新增 ${NEW_ENTRIES} 筆版本、${NEW_CARDS} 張靈感卡）"
            INTRO="AI 編碼工具有新的 release，已同步到 changelog 頁面。"
          fi

          # ── Telegram（parse_mode=HTML，僅支援 b/i/a/code/pre 等標籤）──
          {
            echo "telegram<<TGEOF"
            cat <<TG
          <b>${TITLE}</b>
          ${INTRO}

          <b>新版本條目</b>
          ${V_LIST}

          <b>新靈感卡</b>
          ${C_LIST}

          <b>更新摘要</b>
          <pre>${SUMMARY_ESC}</pre>

          👉 <a href="${PAGE}">開啟 changelog 頁面</a>
          🔗 <a href="${COMMIT_URL}">查看本次 commit</a>
          TG
            echo "TGEOF"
          } >> "$GITHUB_OUTPUT"

          # ── Slack（mrkdwn）──
          {
            echo "slack<<SLEOF"
            cat <<SL
          *${TITLE}*
          ${INTRO}

          *新版本條目*
          ${V_LIST}

          *新靈感卡*
          ${C_LIST}

          *更新摘要*
          \`\`\`
          ${SUMMARY_ESC}
          \`\`\`

          👉 <${PAGE}|開啟 changelog 頁面>   🔗 <${COMMIT_URL}|查看本次 commit>
          SL
            echo "SLEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Notify Telegram
        if: steps.detect.outputs.should_send == 'true'
        shell: bash
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_TEXT: ${{ steps.msg.outputs.telegram }}
        run: |
          set -euo pipefail
          if [ -z "${TG_TOKEN}" ] || [ -z "${TG_CHAT}" ]; then
            echo "TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID 未設定，跳過 Telegram 通知。"
            exit 0
          fi
          code=$(curl -sS -o /tmp/tg.out -w '%{http_code}' \
            "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${TG_TEXT}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true")
          echo "Telegram HTTP ${code}"
          cat /tmp/tg.out; echo
          [ "${code}" = "200" ] || { echo "Telegram 發送失敗"; exit 1; }

      - name: Notify Slack
        if: steps.detect.outputs.should_send == 'true'
        shell: bash
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_TEXT: ${{ steps.msg.outputs.slack }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK_URL}" ]; then
            echo "SLACK_WEBHOOK_URL 未設定，跳過 Slack 通知。"
            exit 0
          fi
          payload=$(jq -n --arg t "${SLACK_TEXT}" '{text: $t, mrkdwn: true}')
          code=$(curl -sS -o /tmp/slack.out -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d "${payload}" "${SLACK_WEBHOOK_URL}")
          echo "Slack HTTP ${code}"
          cat /tmp/slack.out; echo
          [ "${code}" = "200" ] || { echo "Slack 發送失敗"; exit 1; }
