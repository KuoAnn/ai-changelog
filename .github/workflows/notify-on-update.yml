name: Notify on real update

# 當 index.html 有「實際內容更新」或發生「異常」時，透過 Telegram 與 Slack 發通知。
# 通知分兩類，同一次 push 若兩者都有 → 併成一則；只有其一 → 只發該類：
#   1. 更新通知：新增 DATA_* 版本條目或 INSP_* 靈感卡（靠 git diff 偵測）。
#   2. 異常通知：commit summary 出現解析/驗證失敗等關鍵字（靠 %b 內文偵測）。
# 只更新 <b id="lastRefreshed"> 同步時間戳、且無異常的 commit 不觸發。
# 偵測與排程 agent / push 腳本解耦。
#
# 需要的 secrets（未設定的管道會自動跳過，不會讓 workflow 失敗）：
#   TELEGRAM_BOT_TOKEN  BotFather 給的 token
#   TELEGRAM_CHAT_ID    收訊的 chat / channel id
#   SLACK_WEBHOOK_URL   Slack Incoming Webhook URL

on:
  push:
    branches: [main]
    paths:
      - index.html
  workflow_dispatch: {}

permissions:
  contents: read

# 刷新流程每次會對 main 連續推兩次（相隔約 20~70 秒，第一次的 commit 會被第二次改寫成孤兒），
# 兩次各觸發一個 push event → 兩個 notify run → 兩則重複通知。
# concurrency 讓同一 ref 的通知同時只保留最新一個：較新的 push 進來時，
# 取消仍在「等待落定」階段（detect step 的 settle guard）的較早 run。
concurrency:
  group: notify-on-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect real content change
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          # ── 手動觸發：直接視為要發一則測試通知 ──
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            {
              echo "should_send=true"
              echo "is_test=true"
              echo "has_update=true"
              echo "has_anomaly=false"
              echo "new_entries=0"
              echo "new_cards=0"
              echo "anomaly_count=0"
            } >> "$GITHUB_OUTPUT"
            {
              echo "version_details<<EOF"
              echo "EOF"
              echo "card_details<<EOF"
              echo "EOF"
              echo "anomaly<<EOF"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ── 去重 settle guard（止血重複通知）──
          # 刷新流程每次對 main 連續推兩次（實測相隔 20~70 秒，第一次的 commit 會被第二次改寫成孤兒），
          # 兩次各觸發一個 run；只靠 concurrency 不夠（兩 run 常不重疊、彼此取消不到）。
          # 對策：等連續 push 落定後，本次 commit 若已非 main 最新（被後一次 push 取代）→ 跳過，
          # 只讓一連串 push 中的「最後一筆」發通知。sleep 需大於最大 push 間隔（實測 ~71s，取 120s 留裕度）。
          sleep 120
          git fetch --quiet origin "${{ github.ref_name }}" || true
          TIP="$(git rev-parse FETCH_HEAD 2>/dev/null || true)"
          if [ -n "$TIP" ] && [ "$TIP" != "${{ github.sha }}" ]; then
            echo "本次 commit ${{ github.sha }} 已被更新的 push（$TIP）取代，跳過通知（避免重複）。"
            echo "should_send=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "本次 commit 為 main 最新，續行偵測。"

          # ── 決定 diff 範圍 ──
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"
          ZERO="0000000000000000000000000000000000000000"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "$ZERO" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "before SHA 不可用，退回 HEAD~1..HEAD"
            BEFORE="$(git rev-parse HEAD~1)"
            AFTER="$(git rev-parse HEAD)"
          fi
          echo "diff 範圍：$BEFORE..$AFTER"

          # ── 取新增行（排除 +++ 檔頭）──
          ADDED="$(git diff "$BEFORE" "$AFTER" -- index.html | grep -E '^\+' | grep -vE '^\+\+\+' || true)"

          # 新版本條目：DATA_* 物件的 v: "..." 欄位（排除時間戳那行）。
          NEW_ENTRIES="$(printf '%s\n' "$ADDED" | grep -E '[^A-Za-z]v:[[:space:]]*"' | grep -v 'lastRefreshed' || true)"
          # 新靈感卡：新增的 INSP_*.push({ 物件。排程產生的 auto 卡與手動新增卡都涵蓋。
          NEW_CARDS="$(printf '%s\n' "$ADDED" | grep -E '^\+[[:space:]]*INSP_(CC|CA|CI)\.push\(\{' || true)"

          n_entries=$(printf '%s\n' "$NEW_ENTRIES" | grep -cE '.' || true)
          n_cards=$(printf '%s\n' "$NEW_CARDS" | grep -cE '.' || true)
          echo "new_entries=$n_entries  new_cards=$n_cards"

          # ── 更新：有新版本條目或新靈感卡 ──
          has_update=false
          if [ "$n_entries" -gt 0 ] || [ "$n_cards" -gt 0 ]; then
            has_update=true
          fi

          # ── 異常：commit summary 出現失敗類關鍵字 ──
          # summary = commit body（push 腳本傳入的來源摘要），先去掉 Co-Authored-By trailer 與空行。
          SUMMARY_RAW="$(git log -1 --format=%b "$AFTER" || true)"
          SUMMARY="$(printf '%s\n' "$SUMMARY_RAW" | grep -viE '^[[:space:]]*Co-Authored-By:' | sed -E '/^[[:space:]]*$/d' || true)"
          ANOMALY_RE='失敗|封鎖|錯誤|逾時|blocked|error|timeout|rate.?limit'
          # 依「、」與換行切段，只留命中失敗關鍵字的片段（去頭尾空白、去重）
          # 用 sed 而非 tr 切「、」：tr 逐位元組處理會誤傷含 0x81 位元組的中文字（如「封」）。
          anomaly="$(printf '%s\n' "$SUMMARY" | sed 's/、/\n/g' \
            | grep -E "$ANOMALY_RE" \
            | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//' \
            | grep -vE '^$' | sort -u || true)"
          n_anomaly=$(printf '%s\n' "$anomaly" | grep -cE '.' || true)
          has_anomaly=false
          [ "$n_anomaly" -gt 0 ] && has_anomaly=true
          echo "has_update=$has_update  has_anomaly=$has_anomaly"

          should_send=false
          if [ "$has_update" = "true" ] || [ "$has_anomaly" = "true" ]; then
            should_send=true
          fi

          # 抽人類可讀內容：來源 + 版本／標題 + 短摘要。
          # 用 Python 處理 JS 跳脫、HTML 標籤與多行卡片物件，避免 sed 在內容含引號時截斷。
          version_details="$(printf '%s\n' "$NEW_ENTRIES" | python3 -c '
          import html
          import json
          import re
          import sys

          SOURCE_NAMES = {"CC": "Claude Code", "CA": "Codex App", "CI": "Codex CLI"}

          def field(text, name):
              match = re.search(r"(?:^|[,{\s])" + re.escape(name) + r":\s*(\"(?:\\.|[^\"\\])*\")", text)
              if not match:
                  return ""
              try:
                  return json.loads(match.group(1))
              except json.JSONDecodeError:
                  return match.group(1)[1:-1]

          def plain(text):
              text = re.sub(r"<br\s*/?>", " ", text, flags=re.I)
              text = re.sub(r"<[^>]+>", "", text)
              return re.sub(r"\s+", " ", html.unescape(text)).strip()

          def shorten(text, limit=180):
              if len(text) <= limit:
                  return text
              cut = max((text.rfind(mark, 0, limit + 1) + 1 for mark in "。；"), default=0)
              if cut < 80:
                  cut = limit
              return text[:cut].rstrip(" ，；：") + "…"

          # 由 AFTER 版本的 index.html 判斷每個新增物件屬於哪個 DATA_* 陣列。
          source_by_version = {}
          current = ""
          with open("index.html", encoding="utf-8") as page:
              for raw in page:
                  start = re.search(r"const DATA_(CC|CA|CI)\s*=\s*\[", raw)
                  if start:
                      current = start.group(1)
                      continue
                  if current and re.match(r"\s*\];", raw):
                      current = ""
                  elif current:
                      source_by_version[field(raw, "v")] = current

          seen = set()
          for raw in sys.stdin:
              obj = raw[1:].strip() if raw.startswith("+") else raw.strip()
              version = field(obj, "v")
              if not version:
                  continue
              title = plain(field(obj, "title"))
              body = plain(field(obj, "body"))
              summary = shorten((title + ("：" + body if body and body != title else "")) if title else body)
              source = SOURCE_NAMES.get(source_by_version.get(version, ""), "")
              label = " ".join(part for part in (source, version) if part)
              detail = label + ("｜" + summary if summary else "")
              if detail and detail not in seen:
                  print(detail)
                  seen.add(detail)
          ' || true)"

          card_details="$(printf '%s\n' "$ADDED" | python3 -c '
          import html
          import json
          import re
          import sys

          SOURCE_NAMES = {"CC": "Claude Code", "CA": "Codex App", "CI": "Codex CLI"}

          def field(text, name):
              match = re.search(r"(?:^|[,{\s])" + re.escape(name) + r":\s*(\"(?:\\.|[^\"\\])*\")", text)
              if not match:
                  return ""
              try:
                  return json.loads(match.group(1))
              except json.JSONDecodeError:
                  return match.group(1)[1:-1]

          def plain(text):
              text = re.sub(r"<br\s*/?>", " ", text, flags=re.I)
              text = re.sub(r"<[^>]+>", "", text)
              return re.sub(r"\s+", " ", html.unescape(text)).strip()

          def shorten(text, limit=180):
              if len(text) <= limit:
                  return text
              cut = max((text.rfind(mark, 0, limit + 1) + 1 for mark in "。；"), default=0)
              if cut < 80:
                  cut = limit
              return text[:cut].rstrip(" ，；：") + "…"

          card = None
          seen = set()

          def emit(value):
              if not value:
                  return
              feat = plain(field(value["text"], "feat"))
              desc = shorten(plain(field(value["text"], "desc")))
              label = "｜".join(part for part in (SOURCE_NAMES[value["source"]], feat) if part)
              detail = label + ("：" + desc if desc else "")
              if detail and detail not in seen:
                  print(detail)
                  seen.add(detail)

          for raw in sys.stdin:
              line = raw[1:] if raw.startswith("+") else raw
              start = re.search(r"INSP_(CC|CA|CI)\.push\(\{", line)
              if start:
                  emit(card)
                  card = {"source": start.group(1), "text": line}
                  continue
              if card:
                  card["text"] += "\n" + line
                  if re.match(r"\s*\}\);", line):
                      emit(card)
                      card = None
          emit(card)
          ' || true)"

          {
            echo "should_send=$should_send"
            echo "is_test=false"
            echo "has_update=$has_update"
            echo "has_anomaly=$has_anomaly"
            echo "new_entries=$n_entries"
            echo "new_cards=$n_cards"
            echo "anomaly_count=$n_anomaly"
          } >> "$GITHUB_OUTPUT"
          {
            echo "version_details<<EOF"; printf '%s\n' "$version_details"; echo "EOF"
            echo "card_details<<EOF";    printf '%s\n' "$card_details";    echo "EOF"
            echo "anomaly<<EOF";         printf '%s\n' "$anomaly";         echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build messages
        if: steps.detect.outputs.should_send == 'true'
        id: msg
        shell: bash
        # 透過 env 傳入動態值，避免把 ${{ }} 直接插進 shell（防 injection / 引號破壞）
        env:
          IS_TEST: ${{ steps.detect.outputs.is_test }}
          HAS_UPDATE: ${{ steps.detect.outputs.has_update }}
          HAS_ANOMALY: ${{ steps.detect.outputs.has_anomaly }}
          NEW_ENTRIES: ${{ steps.detect.outputs.new_entries }}
          NEW_CARDS: ${{ steps.detect.outputs.new_cards }}
          ANOMALY_COUNT: ${{ steps.detect.outputs.anomaly_count }}
          VERSION_DETAILS: ${{ steps.detect.outputs.version_details }}
          CARD_DETAILS: ${{ steps.detect.outputs.card_details }}
          ANOMALY: ${{ steps.detect.outputs.anomaly }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          set -euo pipefail
          PAGE="https://kuoann.github.io/ai-changelog/"
          nl=$'\n'

          # 跳脫 & < >：Telegram HTML 與 Slack mrkdwn 都吃 &amp; &lt; &gt;
          esc() { sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }
          bullets() { while IFS= read -r line; do [ -n "$line" ] && printf '• %s\n' "$(printf '%s' "$line" | esc)"; done; }

          V_LIST="$(printf '%s\n' "$VERSION_DETAILS" | bullets || true)"
          C_LIST="$(printf '%s\n' "$CARD_DETAILS" | bullets || true)"
          A_LIST="$(printf '%s\n' "$ANOMALY" | bullets || true)"
          [ -z "$A_LIST" ] && A_LIST="•（無詳細訊息）"

          # 組訊息本體：依 test / 更新+異常 / 只更新 / 只異常 條件拼裝。
          # $1=fmt：tg 用 <b></b>，slack 用 *...*
          build_body() {
            local fmt="$1" bo bc
            if [ "$fmt" = "tg" ]; then bo="<b>"; bc="</b>"; else bo="*"; bc="*"; fi

            if [ "$IS_TEST" = "true" ]; then
              printf '%s🧪 AI Changelog 通知測試%s%s' "$bo" "$bc" "$nl"
              printf '若你收到此訊息，代表通知管道設定正常。%s' "$nl"
              return 0
            fi

            # 標題只說明事件類型；數量統一放在各區塊標題，避免重複。
            if [ "$HAS_UPDATE" = "true" ] && [ "$HAS_ANOMALY" = "true" ]; then
              printf '%s🆕 AI Changelog 更新（含異常）%s%s' "$bo" "$bc" "$nl"
            elif [ "$HAS_UPDATE" = "true" ]; then
              printf '%s🆕 AI Changelog 更新%s%s' "$bo" "$bc" "$nl"
            else
              printf '%s⚠️ AI Changelog 更新異常%s%s' "$bo" "$bc" "$nl"
            fi

            # 僅輸出有內容的更新區塊，每筆都包含可讀摘要。
            if [ "$NEW_ENTRIES" -gt 0 ]; then
              printf '%s%s新版本（%s）%s%s%s%s' "$nl" "$bo" "$NEW_ENTRIES" "$bc" "$nl" "$V_LIST" "$nl"
            fi
            if [ "$NEW_CARDS" -gt 0 ]; then
              printf '%s%s新靈感卡（%s）%s%s%s%s' "$nl" "$bo" "$NEW_CARDS" "$bc" "$nl" "$C_LIST" "$nl"
            fi

            # 異常區塊
            if [ "$HAS_ANOMALY" = "true" ]; then
              printf '%s%s⚠️ 異常（%s）%s%s%s%s' "$nl" "$bo" "$ANOMALY_COUNT" "$bc" "$nl" "$A_LIST" "$nl"
            fi
            return 0
          }

          # ── Telegram（parse_mode=HTML，僅支援 b/i/a/code/pre 等標籤）──
          {
            echo "telegram<<TGEOF"
            build_body tg
            printf '%s👉 <a href="%s">開啟 changelog 頁面</a>%s' "$nl" "$PAGE" "$nl"
            printf '🔗 <a href="%s">查看本次 commit</a>%s' "$COMMIT_URL" "$nl"
            echo "TGEOF"
          } >> "$GITHUB_OUTPUT"

          # ── Slack（mrkdwn）──
          {
            echo "slack<<SLEOF"
            build_body slack
            printf '%s👉 <%s|開啟 changelog 頁面>   🔗 <%s|查看本次 commit>%s' "$nl" "$PAGE" "$COMMIT_URL" "$nl"
            echo "SLEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Notify Telegram
        if: steps.detect.outputs.should_send == 'true'
        shell: bash
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_TEXT: ${{ steps.msg.outputs.telegram }}
        run: |
          set -euo pipefail
          if [ -z "${TG_TOKEN}" ] || [ -z "${TG_CHAT}" ]; then
            echo "TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID 未設定，跳過 Telegram 通知。"
            exit 0
          fi
          code=$(curl -sS -o /tmp/tg.out -w '%{http_code}' \
            "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${TG_TEXT}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true")
          echo "Telegram HTTP ${code}"
          cat /tmp/tg.out; echo
          [ "${code}" = "200" ] || { echo "Telegram 發送失敗"; exit 1; }

      - name: Notify Slack
        if: steps.detect.outputs.should_send == 'true'
        shell: bash
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_TEXT: ${{ steps.msg.outputs.slack }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK_URL}" ]; then
            echo "SLACK_WEBHOOK_URL 未設定，跳過 Slack 通知。"
            exit 0
          fi
          payload=$(jq -n --arg t "${SLACK_TEXT}" '{text: $t, mrkdwn: true}')
          code=$(curl -sS -o /tmp/slack.out -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d "${payload}" "${SLACK_WEBHOOK_URL}")
          echo "Slack HTTP ${code}"
          cat /tmp/slack.out; echo
          [ "${code}" = "200" ] || { echo "Slack 發送失敗"; exit 1; }
